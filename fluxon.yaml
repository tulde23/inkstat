# What Fluxon knows about InkStat: its app, its store ids, and where its keys are kept.
# "fluxon project" checks this file and "fluxon keys" checks the keys. Secrets are only
# ever referred to (keylo:, env:, file:), never written here. What differs between
# developers, such as where the checkout is on the Mac, is kept by Fluxon on each PC.
fluxon: 1
name: InkStat

apps:
  inkstat:
    framework: expo
    root: .
    android:
      id: com.inkstat.app
      # The Play upload key, in Keylo under Android (keystore, alias, storePassword,
      # keyPassword). Play App Signing holds the key that signs the app on phones; this one
      # only proves an upload is ours, and Play Console can reset it if it's ever lost.
      signing: keylo:inkstat/android-signing
      # Orbit's Play service account, allowed to release InkStat too (same developer
      # account): Fluxon asks Play for the highest version code with it, and uploads.
      play: { key: keylo:orbit/play, track: internal }
    ios:
      scheme: InkStat
      id: com.inkstat.app
      team: 8R4JRSZ8KB
      # An App Store Connect key belongs to the team, so the one Orbit uses can serve here too.
      # appStore: keylo:<name>

versions:
  marketing: app.json#expo.version
  numbers: store
